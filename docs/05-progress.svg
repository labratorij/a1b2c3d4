<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img">
<style>
  svg {
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --muted: #52514e;
    --grid: #e3e2df;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --surface: #1a1a19;
      --text: #ffffff;
      --muted: #c3c2b7;
      --grid: #333330;
    }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--text); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11.5px; }
  .lbl { fill: var(--text); font-size: 12px; }
  .val { fill: var(--text); font-size: 12px; font-weight: 600; }
  .ax { fill: var(--muted); font-size: 11px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  
</style>
<rect class="bg" width="760" height="268" rx="6"/>
<text class="title" x="18" y="26">Цепочка улучшений: mAP@10, эталонный протокол</text>
<text class="sub" x="18" y="46">все замеры по одной методике; re-ranking настроенный, кроме последней справочной строки</text>
<line class="grid" x1="272.0" y1="66" x2="272.0" y2="216"/>
<text class="ax" x="272.0" y="60" text-anchor="middle">0.80</text>
<line class="grid" x1="375.0" y1="66" x2="375.0" y2="216"/>
<text class="ax" x="375.0" y="60" text-anchor="middle">0.83</text>
<line class="grid" x1="478.0" y1="66" x2="478.0" y2="216"/>
<text class="ax" x="478.0" y="60" text-anchor="middle">0.86</text>
<line class="grid" x1="581.0" y1="66" x2="581.0" y2="216"/>
<text class="ax" x="581.0" y="60" text-anchor="middle">0.89</text>
<line class="grid" x1="684.0" y1="66" x2="684.0" y2="216"/>
<text class="ax" x="684.0" y="60" text-anchor="middle">0.92</text>
<text class="lbl" x="260" y="86" text-anchor="end">v2 — Tier-1</text>
<rect x="272" y="74" width="57.3" height="16" rx="4" fill="var(--s1)"/>
<text class="val" x="337.3" y="87">0.817</text>
<text class="lbl" x="260" y="116" text-anchor="end">+ кросс-камерное обучение (v7)</text>
<rect x="272" y="104" width="181.6" height="16" rx="4" fill="var(--s1)"/>
<text class="val" x="461.6" y="117">0.853</text>
<text class="sub" x="505.6" y="117">+3.6</text>
<text class="lbl" x="260" y="146" text-anchor="end">+ ансамбль v7+clip+r101</text>
<rect x="272" y="134" width="260.9" height="16" rx="4" fill="var(--s1)"/>
<text class="val" x="540.9" y="147">0.876</text>
<text class="sub" x="584.9" y="147">+2.3</text>
<text class="lbl" x="260" y="176" text-anchor="end">+ замена на v10ext+r101 (512px)</text>
<rect x="272" y="164" width="323.1" height="16" rx="4" fill="var(--s3)"/>
<text class="val" x="603.1" y="177">0.894</text>
<text class="sub" x="647.1" y="177">+1.8</text>
<text class="lbl" x="260" y="206" text-anchor="end">справочно: ансамбль без re-ranking</text>
<rect x="272" y="194" width="131.8" height="16" rx="4" fill="var(--s2)"/>
<text class="val" x="411.8" y="207">0.838</text>
<text class="sub" x="455.8" y="207">вклад постобработки +3.8</text>
<text class="sub" x="18" y="254">последняя строка - не шаг цепочки, а замер вклада самого re-ranking</text>
</svg>