<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img">
<style>
  svg {
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --muted: #52514e;
    --grid: #e3e2df;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --surface: #1a1a19;
      --text: #ffffff;
      --muted: #c3c2b7;
      --grid: #333330;
    }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--text); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11.5px; }
  .lbl { fill: var(--text); font-size: 12px; }
  .val { fill: var(--text); font-size: 12px; font-weight: 600; }
  .ax { fill: var(--muted); font-size: 11px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  
</style>
